<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Pip's face as the favicon. Simplified HARD for 16–32px legibility: a bold,
       full-bleed crimson die silhouette (the brand's signature colour, legible on
       both light and dark browser tabs) with a minimal high-contrast cream face —
       two round eyes + an asymmetric smirk that reads as Pip's confident, slightly
       smug resting expression. apple-icon.tsx mirrors this exact geometry. -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="#c0392b" />
  <!-- Eyes — bold cream dots; they survive downscaling where pip-clusters mush. -->
  <circle cx="37" cy="45" r="9.5" fill="#f6f1e7" />
  <circle cx="63" cy="45" r="9.5" fill="#f6f1e7" />
  <!-- Smirk — a thick cream stroke pulling up to the right (the smug tell). -->
  <path d="M32 66 Q49 79 68 60" fill="none" stroke="#f6f1e7" stroke-width="8" stroke-linecap="round" />
</svg>
